<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Strategy comparison results</title>
  <desc id="desc">Two-panel chart comparing quality metrics and P95 latency for dense, dense-rerank, sparse, and hybrid-rerank strategies.</desc>
  <rect width="1120" height="560" rx="18" fill="#07111f"/>
  <rect x="24" y="22" width="1072" height="516" rx="14" fill="#0b1220" stroke="#164e63" stroke-width="1.5"/>

  <text x="56" y="58" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Final verified strategy comparison</text>
  <text x="56" y="84" fill="#9cc8d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Quality scores use a 0 to 1 scale. P95 latency is measured in milliseconds and varies by run/environment.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="70" y="128" fill="#f0f9ff" font-size="16" font-weight="700">A. Retrieval quality</text>
    <line x1="80" y1="402" x2="650" y2="402" stroke="#31566b" stroke-width="1"/>
    <line x1="80" y1="342" x2="650" y2="342" stroke="#1e3d50" stroke-width="1"/>
    <line x1="80" y1="282" x2="650" y2="282" stroke="#1e3d50" stroke-width="1"/>
    <line x1="80" y1="222" x2="650" y2="222" stroke="#1e3d50" stroke-width="1"/>
    <line x1="80" y1="162" x2="650" y2="162" stroke="#1e3d50" stroke-width="1"/>
    <text x="58" y="407" fill="#9cc8d8" font-size="11">0.0</text>
    <text x="58" y="347" fill="#9cc8d8" font-size="11">0.25</text>
    <text x="58" y="287" fill="#9cc8d8" font-size="11">0.50</text>
    <text x="58" y="227" fill="#9cc8d8" font-size="11">0.75</text>
    <text x="58" y="167" fill="#9cc8d8" font-size="11">1.0</text>

    <g>
      <rect x="108" y="234" width="18" height="168" fill="#38bdf8"/>
      <rect x="130" y="186" width="18" height="216" fill="#22d3ee"/>
      <rect x="152" y="246" width="18" height="156" fill="#5eead4"/>
      <rect x="174" y="270" width="18" height="132" fill="#a78bfa"/>
      <text x="150" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">dense</text>
    </g>
    <g>
      <rect x="245" y="222" width="18" height="180" fill="#38bdf8"/>
      <rect x="267" y="198" width="18" height="204" fill="#22d3ee"/>
      <rect x="289" y="234" width="18" height="168" fill="#5eead4"/>
      <rect x="311" y="222" width="18" height="180" fill="#a78bfa"/>
      <text x="287" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">dense-rerank</text>
    </g>
    <g>
      <rect x="383" y="270" width="18" height="132" fill="#38bdf8"/>
      <rect x="405" y="210" width="18" height="192" fill="#22d3ee"/>
      <rect x="427" y="258" width="18" height="144" fill="#5eead4"/>
      <rect x="449" y="222" width="18" height="180" fill="#a78bfa"/>
      <text x="425" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">sparse</text>
    </g>
    <g>
      <rect x="520" y="222" width="18" height="180" fill="#38bdf8"/>
      <rect x="542" y="198" width="18" height="204" fill="#22d3ee"/>
      <rect x="564" y="234" width="18" height="168" fill="#5eead4"/>
      <rect x="586" y="222" width="18" height="180" fill="#a78bfa"/>
      <text x="562" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">hybrid-rerank</text>
    </g>

    <rect x="86" y="462" width="12" height="12" fill="#38bdf8"/>
    <text x="104" y="473" fill="#c7e9f4" font-size="12">Tool@1</text>
    <rect x="170" y="462" width="12" height="12" fill="#22d3ee"/>
    <text x="188" y="473" fill="#c7e9f4" font-size="12">Tool@3</text>
    <rect x="254" y="462" width="12" height="12" fill="#5eead4"/>
    <text x="272" y="473" fill="#c7e9f4" font-size="12">Memory@1</text>
    <rect x="365" y="462" width="12" height="12" fill="#a78bfa"/>
    <text x="383" y="473" fill="#c7e9f4" font-size="12">Evidence@3</text>

    <text x="710" y="128" fill="#f0f9ff" font-size="16" font-weight="700">B. P95 latency</text>
    <line x1="735" y1="402" x2="1050" y2="402" stroke="#31566b" stroke-width="1"/>
    <line x1="735" y1="342" x2="1050" y2="342" stroke="#1e3d50" stroke-width="1"/>
    <line x1="735" y1="282" x2="1050" y2="282" stroke="#1e3d50" stroke-width="1"/>
    <line x1="735" y1="222" x2="1050" y2="222" stroke="#1e3d50" stroke-width="1"/>
    <line x1="735" y1="162" x2="1050" y2="162" stroke="#1e3d50" stroke-width="1"/>
    <text x="704" y="407" fill="#9cc8d8" font-size="11">0</text>
    <text x="692" y="347" fill="#9cc8d8" font-size="11">350</text>
    <text x="692" y="287" fill="#9cc8d8" font-size="11">700</text>
    <text x="684" y="227" fill="#9cc8d8" font-size="11">1050</text>
    <text x="684" y="167" fill="#9cc8d8" font-size="11">1400</text>

    <rect x="762" y="384" width="42" height="18" fill="#38bdf8"/>
    <text x="783" y="376" text-anchor="middle" fill="#c7e9f4" font-size="11">83.96</text>
    <text x="783" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">dense</text>

    <rect x="840" y="137" width="42" height="265" fill="#22d3ee"/>
    <text x="861" y="129" text-anchor="middle" fill="#c7e9f4" font-size="11">1235.73</text>
    <text x="861" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">dense-rerank</text>

    <rect x="918" y="400" width="42" height="2" fill="#5eead4"/>
    <text x="939" y="392" text-anchor="middle" fill="#c7e9f4" font-size="11">2.05</text>
    <text x="939" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">sparse</text>

    <rect x="996" y="119" width="42" height="283" fill="#a78bfa"/>
    <text x="1017" y="111" text-anchor="middle" fill="#c7e9f4" font-size="11">1322.92</text>
    <text x="1017" y="430" text-anchor="middle" fill="#c7e9f4" font-size="12">hybrid-rerank</text>

    <text x="735" y="473" fill="#9cc8d8" font-size="12">Final release-readiness rerun, Qdrant local-memory mode.</text>
  </g>
</svg>
